# 精简版 HiFi verb（基于 linux_latte fix_file/audio 与 audio.md，适配 alsa-lib 1.2.x）
# 去掉了 If.Controls.ControlExists（此版本报 cannot determine control device）与
# EnableSequence 中的 cset（报 cdev is not defined）；mixer 路由由用户/面板控制，
# 或用 amixer 手动设置（如右声道修复：amixer -c0 cset "name='Amp Input1'" Right）。
SectionVerb {
	Value {
		PlaybackPCM "hw:chtbswrt5659"
		PlaybackMixerElem "DAC1"
		PlaybackVolume "DAC1 Playback Volume"
		PlaybackSwitch "DAC1 Playback Switch"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"
	ConflictingDevice []
	EnableSequence [
		cset "hw:chtbswrt5659:name='DAC1 Playback Switch' on"
	]
	DisableSequence [
		cset "hw:chtbswrt5659:name='DAC1 Playback Switch' off"
	]
}
