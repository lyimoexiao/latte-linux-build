# 精简版 HiFi verb（基于 linux_latte fix_file/audio 与 audio.md，适配 alsa-lib 1.2.x）
#
# 音频路由说明（xiaomi-latte）：
#   - 扬声器走 rt5659 模拟输出，由 tfa9890 功放（i2c-tfa9890:00/01，地址 0x37/0x34）
#     驱动。功放使能位（SYS_CTRL AMPE）已由内核补丁改为 ALSA 控件
#     "Amp Switch L"/"Amp Switch R"（DAPM 不再自动置位），用户空间可控制。
#   - 3.5mm 耳机走 rt5659 模拟 HPO。耳机模式需打开模拟 mixer 开关
#     （DAC1 MIXL/R DAC1、Stereo DAC MIXL/R DAC L1/R1）并设置 codec_out0 增益，
#     同时关闭扬声器功放（Amp Switch L/R off）。
#   - 插拔检测由内核 rt5659 JD3 检测 + 轮询上报（audio-headphone-jack.patch），
#     WirePlumber 依 jack 自动切换 profile；latte-audio-switch.service 按
#     profile 应用上述路由。
#
# 注：本文件 EnableSequence 供 alsaucm 等 UCM 客户端使用；实际切换由
#     latte-audio-switch 服务执行（cset 语法在 alsa-lib 1.2.x 下有 cdev 限制）。
SectionVerb {
	Value {
		PlaybackPCM "hw:chtbswrt5659"
		PlaybackMixerElem "DAC1"
		PlaybackVolume "DAC1 Playback Volume"
		PlaybackSwitch "DAC1 Playback Switch"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo Speakers"
	ConflictingDevice []
	EnableSequence [
		cset "name='Amp Switch L' on"
		cset "name='Amp Switch R' on"
		cset "name='DAC1 Playback Switch' on"
	]
	DisableSequence [
		cset "name='DAC1 Playback Switch' off"
	]
}

SectionDevice."HeadPhones" {
	Comment "3.5mm Headphones"
	EnableSequence [
		cset "name='codec_out0 Gain 0 Volume' 0"
		cset "name='codec_out0 Gain 0 Switch' on"
		cset "name='DAC1 Playback Switch' on"
		cset "name='DAC1 MIXL DAC1 Switch' on"
		cset "name='DAC1 MIXR DAC1 Switch' on"
		cset "name='Stereo DAC MIXL DAC L1 Switch' on"
		cset "name='Stereo DAC MIXR DAC R1 Switch' on"
		cset "name='HPO L Playback Switch' on"
		cset "name='HPO R Playback Switch' on"
		cset "name='Headphone Switch' on"
		cset "name='Headphone Playback Volume' 28"
		cset "name='Amp Switch L' off"
		cset "name='Amp Switch R' off"
	]
	DisableSequence [
		cset "name='HPO L Playback Switch' off"
		cset "name='HPO R Playback Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='Amp Switch L' on"
		cset "name='Amp Switch R' on"
	]
}
