# ALSA UCM 入口（声卡 id = chtbswrt5659）
# 说明：新版 alsa-lib(1.2.x) 按 /usr/share/alsa/ucm2/<card_id>/<card_id>.conf 查找，
# conf.d 软链与 fix_file/audio 的旧布局无法匹配声卡；HiFi.conf 的 If.Controls/
# ${CardId}/cset 在此版本会分别报 ControlExists/cdev 错误，故提供精简版。
Syntax 4

Define.CardId "chtbswrt5659"
Define.cdev "hw:chtbswrt5659"

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Default"
}
