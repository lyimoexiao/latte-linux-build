#!/usr/bin/env bash
# latte-linux-build 全局配置
# 所有脚本通过 scripts/helpers.sh source 本文件。
# 修改默认值即可调整构建行为，无需改动脚本本身。

# ---------- 设备 ----------
DEVICE_NAME="xiaomi-latte"      # 刷机包前缀
DEVICE_PRODUCT="latte"          # fastboot getvar product 校验值

# ---------- 内核（linux_latte） ----------
KERNEL_REPO="https://github.com/xiaomi-latte-dev/linux_latte"
KERNEL_REF="main"               # 可指定 commit / tag / branch
KERNEL_DEFCONFIG="xiaomipad2_defconfig"
KERNEL_LOCALVERSION="-latte"    # 内核版本后缀 -> 6.14.0-latte
KERNEL_DEB_ARCH="amd64"

# ---------- 发行版（debootstrap） ----------
DEBIAN_SUITE="trixie"           # Debian 13 stable
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://security.debian.org/debian-security"
DEBIAN_COMPONENTS="main contrib non-free-firmware"

UBUNTU_SUITE="noble"            # Ubuntu 24.04 LTS（26.04 LTS 可改 resolute）
UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"
UBUNTU_SECURITY_MIRROR="http://security.ubuntu.com/ubuntu"
UBUNTU_COMPONENTS="main universe"

# ---------- 构建矩阵（Server 仅 en-US，Desktop 含 en-US/zh-CN） ----------
DISTROS="${DISTROS:-debian ubuntu}"
EDITIONS="${EDITIONS:-server desktop}"
LANGS="${LANGS:-en-US zh-CN}"

# ---------- 镜像 ----------
BOOT_IMG_SIZE_MB=256            # boot 分区 ESP（与 gpt.ini 的 len=256 对应）
ROOT_IMG_SIZE_MB=8192           # root 镜像大小；实际分区占满磁盘剩余空间，首启通过 x-systemd.growfs 自动扩容
ROOT_FS_TYPE="ext4"
ROOT_LABEL="latte-root"
# 根文件系统固定 UUID：mkfs.ext4 -U 与 grub.cfg / fstab 必须一致
ROOT_UUID="d0b5c5a1-6a7c-4a8e-b3f2-9c4d0e5f6a7b"
SYSTEM_PART_LABEL="system"      # 与 gpt.ini 中分区 label 一致
BOOT_PART_LABEL="boot"

# ---------- 语言 / 时区 ----------
TIMEZONE_EN="Etc/UTC"
TIMEZONE_ZH="Asia/Shanghai"

# ---------- 默认用户（首次启动凭据，README 中强烈提示改密） ----------
DEFAULT_USER="latte"
DEFAULT_PASSWORD="latte"

# ---------- 工作目录（相对仓库根） ----------
WORKDIR="work"
OUTDIR="dist"
KERNEL_SRC="$WORKDIR/src/linux_latte"     # 内核源码树
KERNEL_OUT="$WORKDIR/kernel"              # 内核构建产物（.deb / 固件）
ROOTFS_BASE="$WORKDIR/rootfs"
STAGE="$WORKDIR/stage"

# ---------- 设备固件（内核仓库 fix_file/，Stage2 部署到 rootfs） ----------
FW_WIFI="brcmfmac4356-pcie.Xiaomi Inc-Mipad2.txt"
FW_BT="BCM4356A2.hcd"
FW_ISP="shisp_2401a0_v21.bin"
