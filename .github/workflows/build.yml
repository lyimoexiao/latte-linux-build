name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      distro:
        description: 发行版
        type: choice
        default: all
        options: [all, debian, ubuntu]
      edition:
        description: 版本
        type: choice
        default: all
        options: [all, server, desktop]
      lang:
        description: 语言
        type: choice
        default: all
        options: [all, en-US, zh-CN]
      kernel_ref:
        description: 内核 ref (commit/tag/branch)
        type: string
        default: main

env:
  KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'main' }}

jobs:
  # ---------- 内核构建（一次，产物供全部 rootfs job 复用） ----------
  build-kernel:
    runs-on: ubuntu-latest
    outputs:
      kernel_release: ${{ steps.krel.outputs.kernel_release }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev ccache \
            dpkg-dev debhelper rsync ca-certificates git
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: work/ccache
          key: kernel-ccache-${{ env.KERNEL_REF }}-${{ github.sha }}
          restore-keys: kernel-ccache-${{ env.KERNEL_REF }}-
      - name: 构建内核
        id: krel
        run: |
          export CCACHE_DIR="$PWD/work/ccache"
          export PATH="/usr/lib/ccache:$PATH"
          ./scripts/stage-1-kernel.sh --ref "$KERNEL_REF"
          echo "kernel_release=$(cat work/kernel/kernel-release)" >> "$GITHUB_OUTPUT"
      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.krel.outputs.kernel_release }}
          path: work/kernel
          retention-days: 7

  # ---------- rootfs + 镜像 + 打包（硬编码矩阵；Server 仅 en-US） ----------
  # 说明：
  # 1) 矩阵固定 10 组合（Server 只出 en-US；desktop=XFCE，desktop-gnome=GNOME）。
  #    不使用 fromJSON 动态矩阵——该模式在本仓库实测无法创建矩阵 job。
  # 2) 手动构建（workflow_dispatch）时按输入在 step 级裁剪（job 级 if 无法
  #    引用 matrix 上下文）。push/tag 时 inputs 为空 -> 全部执行。
  build-rootfs:
    needs: build-kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
              - { distro: debian, edition: server,         lang: en-US }
              - { distro: debian, edition: desktop,        lang: en-US }
              - { distro: debian, edition: desktop,        lang: zh-CN }
              - { distro: debian, edition: desktop-gnome,  lang: en-US }
              - { distro: debian, edition: desktop-gnome,  lang: zh-CN }
              - { distro: ubuntu, edition: server,         lang: en-US }
              - { distro: ubuntu, edition: desktop,        lang: en-US }
              - { distro: ubuntu, edition: desktop,        lang: zh-CN }
              - { distro: ubuntu, edition: desktop-gnome,  lang: en-US }
              - { distro: ubuntu, edition: desktop-gnome,  lang: zh-CN }
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        if: >-
          ${{ ((github.event.inputs.distro || 'all') == 'all' ||
              (github.event.inputs.distro || 'all') == matrix.distro) &&
             ((github.event.inputs.edition || 'all') == 'all' ||
              (github.event.inputs.edition || 'all') == matrix.edition) &&
             ((github.event.inputs.lang || 'all') == 'all' ||
              (github.event.inputs.lang || 'all') == matrix.lang) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap rsync dosfstools e2fsprogs python3 ca-certificates \
            debian-archive-keyring ubuntu-keyring android-sdk-libsparse-utils
      - name: 下载内核产物
        if: >-
          ${{ ((github.event.inputs.distro || 'all') == 'all' ||
              (github.event.inputs.distro || 'all') == matrix.distro) &&
             ((github.event.inputs.edition || 'all') == 'all' ||
              (github.event.inputs.edition || 'all') == matrix.edition) &&
             ((github.event.inputs.lang || 'all') == 'all' ||
              (github.event.inputs.lang || 'all') == matrix.lang) }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ needs.build-kernel.outputs.kernel_release }}
          path: work/kernel
      - name: 构建并打包（stage 2-4）
        if: >-
          ${{ ((github.event.inputs.distro || 'all') == 'all' ||
              (github.event.inputs.distro || 'all') == matrix.distro) &&
             ((github.event.inputs.edition || 'all') == 'all' ||
              (github.event.inputs.edition || 'all') == matrix.edition) &&
             ((github.event.inputs.lang || 'all') == 'all' ||
              (github.event.inputs.lang || 'all') == matrix.lang) }}
        run: |
          sudo env "PATH=$PATH" ./scripts/build.sh \
            --skip-kernel \
            --distro ${{ matrix.distro }} \
            --edition ${{ matrix.edition }} \
            --lang ${{ matrix.lang }}
      - name: 上传刷机包
        if: >-
          ${{ ((github.event.inputs.distro || 'all') == 'all' ||
              (github.event.inputs.distro || 'all') == matrix.distro) &&
             ((github.event.inputs.edition || 'all') == 'all' ||
              (github.event.inputs.edition || 'all') == matrix.edition) &&
             ((github.event.inputs.lang || 'all') == 'all' ||
              (github.event.inputs.lang || 'all') == matrix.lang) }}
        uses: actions/upload-artifact@v4
        with:
          name: flash-package-${{ matrix.distro }}-${{ matrix.edition }}-${{ matrix.lang }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------- Release（仅 tag 触发） ----------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flash-package-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
