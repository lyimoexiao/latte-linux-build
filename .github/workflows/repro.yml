name: repro-matrix
on: [push]

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.m.outputs.combos }}
    steps:
      - id: m
        run: echo 'combos=[{"a":1},{"a":2}]' >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.combos) }}
    steps:
      - run: echo "combo a=${{ matrix.a }}"
