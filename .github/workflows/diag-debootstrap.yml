name: diag-debootstrap
on: [workflow_dispatch]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap rsync python3 ca-certificates wget curl debian-archive-keyring ubuntu-keyring
      - name: bash -x 精确复刻 stage-2
        run: |
          mkdir -p work/kernel/debs
          echo "6.14.0-latte" > work/kernel/kernel-release
          touch work/kernel/debs/linux-image-6.14.0-latte_1_amd64.deb
          sudo env "PATH=$PATH" bash -x ./scripts/stage-2-rootfs.sh ubuntu server en-US 2>&1 | tail -70
