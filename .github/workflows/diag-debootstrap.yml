name: diag-debootstrap
on: [workflow_dispatch]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap rsync python3 ca-certificates wget curl
          debootstrap --version
      - name: debootstrap ubuntu
        run: |
          rm -rf /tmp/r1
          sudo debootstrap --variant=minbase --arch=amd64 --components="main,universe" noble /tmp/r1 http://archive.ubuntu.com/ubuntu
          echo "UBUNTU_EXIT=$?"
          ls /tmp/r1 2>/dev/null | head
      - name: debootstrap debian
        run: |
          rm -rf /tmp/r2
          sudo debootstrap --variant=minbase --arch=amd64 --components="main contrib non-free-firmware" trixie /tmp/r2 http://deb.debian.org/debian
          echo "DEBIAN_EXIT=$?"
          ls /tmp/r2 2>/dev/null | head
