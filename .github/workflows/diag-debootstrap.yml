name: diag-debootstrap
on: [workflow_dispatch]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 deps + 打印 PATH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap rsync python3 ca-certificates wget curl debian-archive-keyring ubuntu-keyring
          echo "RUNNER_PATH=$PATH"
      - name: 普通 sudo（对照，已确认成功）
        run: |
          sudo debootstrap --variant=minbase --arch=amd64 --components="main,universe" noble /tmp/diag-s http://archive.ubuntu.com/ubuntu
          echo "SUDO_EXIT=$?"
      - name: sudo env PATH（复现 build-rootfs 包装）
        run: |
          rm -rf /tmp/diag-e
          sudo env "PATH=$PATH" debootstrap --variant=minbase --arch=amd64 --components="main,universe" noble /tmp/diag-e http://archive.ubuntu.com/ubuntu
          echo "ENV_EXIT=$?"
