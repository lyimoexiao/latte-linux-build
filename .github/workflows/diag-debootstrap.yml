name: diag-debootstrap
on: [workflow_dispatch]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap rsync python3 ca-certificates wget curl debian-archive-keyring ubuntu-keyring
      - name: debootstrap 绝对路径（对照）
        run: |
          rm -rf /tmp/diag-a
          sudo debootstrap --variant=minbase --arch=amd64 --components="main,universe" noble /tmp/diag-a http://archive.ubuntu.com/ubuntu
          echo "ABS_EXIT=$?"
      - name: debootstrap 相对路径（复现 stage-2 调用）
        run: |
          rm -rf diag-rel && mkdir -p diag-rel
          sudo debootstrap --variant=minbase --arch=amd64 --components="main,universe" noble ./diag-rel http://archive.ubuntu.com/ubuntu
          echo "REL_EXIT=$?"
